<!DOCTYPE html>
<html class="notranslate" translate="no" lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>通讯 — New Asian Pathways</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  
  <style>
    .gate { max-width: 28rem; margin: 4rem auto; text-align: center; }
    .gate input { width: 100%; padding: .7rem .85rem; border: 1px solid var(--color-border); border-radius: 10px; font: inherit; margin: .5rem 0 1rem; }
    .newsletter-content { display: none; max-width: 48rem; margin: 2rem auto; }
    .newsletter-content.is-open { display: block; }
    .issue { background: #fff; border: 1px solid var(--color-border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
  </style>

</head>
<body class="notranslate" data-page="newsletter" data-base="../">
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">New Asian <span>Pathways</span></a>
      <div class="header-tools">
        <nav class="lang-switcher" aria-label="语言">
          <a href="../newsletter.html" hreflang="en" data-lang="en">EN</a>
          <a href="../ko/newsletter.html" hreflang="ko" data-lang="ko">한국어</a>
          <a href="newsletter.html" hreflang="zh-Hans" data-lang="zh" aria-current="true">中文</a>
        </nav>
        <button class="nav-toggle" type="button" aria-label="菜单" aria-expanded="false">菜单</button>
      </div>
      <nav class="nav" aria-label="Primary">
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <a href="index.html#focus">地区</a>
        <a href="index.html#programs">事工</a>
        <a href="newsletter.html" aria-current="page">通讯</a>
        <a href="index.html#contact">联系</a>
        <a class="btn btn-primary" href="https://give.tithe.ly/?formId=4e3604e2-ff67-4aeb-99ef-311428aea7fa" target="_blank" rel="noopener">奉献</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <div class="gate" id="gate">
      <p class="eyebrow">仅限伙伴</p>
      <h1>通讯</h1>
      <p>此通讯仅供与我们同行的伙伴阅读。如需申请访问，请使用首页的订阅框，或发送邮件至 info@newasianpathways.org。若我们批准您的申请，会将访问代码发送给您。请在下方输入该代码。</p>
      <form id="code-form">
        <label class="sr-only" for="code">访问代码</label>
        <input id="code" type="password" placeholder="输入访问代码" required autocomplete="off">
        <button class="btn btn-primary" type="submit">进入</button>
      </form>
      <p id="code-error" class="subscribe-note" hidden>代码不正确。请检查我们发送给您的代码或联系我们。</p>
    </div>
    <div class="newsletter-content" id="content">
      <p class="eyebrow">伙伴</p>
      <h1>通讯</h1>
      <p>感谢与我们同行。新的一期将显示在这里。</p>
      <div class="issue">
        <h2>最新一期</h2>
        <p>尚未发布。下一期通讯准备好后，将显示给拥有访问代码的伙伴。</p>
      </div>
    </div>
  </main>
  <script src="../assets/js/main.js"></script>
  
  <script>
    (function () {
      var CODE = "NAP2026";
      var gate = document.getElementById("gate");
      var content = document.getElementById("content");
      var form = document.getElementById("code-form");
      var error = document.getElementById("code-error");
      var key = "nap-newsletter-ok";
      function open() {
        gate.style.display = "none";
        content.classList.add("is-open");
        try { sessionStorage.setItem(key, "1"); } catch (e) {}
      }
      if (sessionStorage.getItem(key) === "1") open();
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var val = (document.getElementById("code").value || "").trim();
        if (val === CODE) { error.hidden = true; open(); }
        else { error.hidden = false; }
      });
    })();
  </script>

</body>
</html>
